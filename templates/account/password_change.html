{% extends "account/_card.html" %}
{% block title %}Cambiar contraseña · PriceWatch{% endblock %}
{% block card %}
<h1 style="font-size:28px">Cambiar contraseña</h1>
<form method="post" action="{% url 'account_change_password' %}" style="display:flex;flex-direction:column;gap:16px">
  {% csrf_token %}
  <div class="field"><label for="op">Contraseña actual</label>
    <input id="op" type="password" name="oldpassword" autocomplete="current-password" required>{{ form.oldpassword.errors }}</div>
  <div class="field"><label for="np1">Contraseña nueva</label>
    <input id="np1" type="password" name="password1" autocomplete="new-password" required>{{ form.password1.errors }}</div>
  <div class="field"><label for="np2">Repite la contraseña nueva</label>
    <input id="np2" type="password" name="password2" autocomplete="new-password" required>{{ form.password2.errors }}</div>
  <button type="submit" class="btn btn-dark btn-block" style="height:50px">Guardar</button>
</form>
<a href="{% url 'profile' %}" style="text-align:center;font-weight:600;font-size:14px">Volver a mi cuenta</a>
{% endblock %}
