{% extends "account/_card.html" %}
{% block title %}Recupera tu contraseña · PriceWatch{% endblock %}
{% block card %}
<h1 style="font-size:30px;line-height:1.15">Recupera tu contraseña</h1>
<p class="muted" style="margin:0;font-size:15px;line-height:1.5">Escribe tu correo y te enviaremos un enlace para crear una nueva.</p>
<form method="post" action="{% url 'account_reset_password' %}" style="display:flex;flex-direction:column;gap:16px">
  {% csrf_token %}
  <div class="field">
    <label for="rp-email">Correo electrónico</label>
    <input id="rp-email" type="email" name="email" autocomplete="email" placeholder="tu@correo.com" value="{{ form.email.value|default_if_none:'' }}" required>
    {{ form.email.errors }}
  </div>
  <button type="submit" class="btn btn-dark btn-block" style="height:50px">Enviar enlace</button>
</form>
<a href="{% url 'account_login' %}" style="text-align:center;font-weight:600;font-size:14px">Volver a iniciar sesión</a>
{% endblock %}
