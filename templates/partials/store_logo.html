{# Logo de la tienda (si la API nos lo da) o su nombre. Uso: include con store=... url=... #}
<a class="store-logo" href="{{ url|default:store.website }}" target="_blank" rel="noopener sponsored" aria-label="Ir a {{ store.name }}">
  {% if store.logo_url %}<img src="{{ store.logo_url }}" alt="" loading="lazy">{% endif %}
  <span>{{ store.name }}</span>
</a>
